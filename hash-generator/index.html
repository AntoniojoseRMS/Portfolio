<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HASHGEN://SYS_v1.0</title>
<style>
  :root{
    --bg:#0a0e0d;
    --panel:#0f1613;
    --border:#1e2b26;
    --green:#39ff88;
    --green-dim:#1f8a52;
    --text:#c9f5da;
    --muted:#5f8a75;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 0%, rgba(57,255,136,0.06), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Courier New', 'Consolas', monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .term{
    width:100%;
    max-width:560px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    box-shadow:0 0 40px rgba(57,255,136,0.06), inset 0 0 60px rgba(0,0,0,0.4);
    overflow:hidden;
  }
  .titlebar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 14px;
    border-bottom:1px solid var(--border);
    font-size:12px;
    letter-spacing:1px;
    color:var(--green);
  }
  .titlebar .dots span{
    display:inline-block;
    width:8px;height:8px;
    border-radius:50%;
    margin-left:5px;
    background:var(--border);
  }
  .statusline{
    display:flex;
    justify-content:space-between;
    padding:8px 14px;
    font-size:11px;
    color:var(--muted);
    border-bottom:1px dashed var(--border);
  }
  .statusline b{color:var(--green);}
  .body{padding:18px;}
  textarea{
    width:100%;
    min-height:90px;
    background:#060908;
    border:1px solid var(--border);
    border-radius:4px;
    color:var(--text);
    font-family:inherit;
    font-size:13px;
    padding:12px;
    resize:vertical;
    margin-bottom:14px;
  }
  textarea:focus{outline:1px solid var(--green-dim);}
  .hash-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:6px 0;
    border-bottom:1px dashed var(--border);
    font-size:11px;
  }
  .hash-row:last-child{border-bottom:none;}
  .hash-row .algo{
    color:var(--green);
    width:70px;
    flex-shrink:0;
    font-weight:bold;
  }
  .hash-row .value{
    flex:1;
    word-break:break-all;
    color:var(--text);
    margin:0 10px;
    min-height:14px;
  }
  .hash-row .value.empty{color:var(--muted);}
  .copy-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--muted);
    font-family:inherit;
    font-size:10px;
    padding:3px 7px;
    border-radius:3px;
    cursor:pointer;
    flex-shrink:0;
  }
  .copy-btn:hover{border-color:var(--green);color:var(--green);}
  .hashes{margin-top:4px;}
  .footer{
    padding:10px 14px;
    border-top:1px solid var(--border);
    font-size:10.5px;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
  }
  .footer a{color:var(--muted);text-decoration:none;}
  .footer a:hover{color:var(--green);}
  .blink{animation:blink 1.4s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
</style>
</head>
<body>
  <div class="term">
    <div class="titlebar">
      <span>HASHGEN<span class="blink">_</span>://SYS_v1.0</span>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
    <div class="statusline">
      <span>STATUS: <b>ONLINE</b></span>
      <span>PROCESSAMENTO: <b>100% LOCAL</b></span>
    </div>
    <div class="body">
      <textarea id="input" placeholder="digite ou cole o texto aqui..."></textarea>
      <div class="hashes">
        <div class="hash-row">
          <span class="algo">MD5</span>
          <span class="value empty" id="v-md5">—</span>
          <button class="copy-btn" data-target="v-md5">COPIAR</button>
        </div>
        <div class="hash-row">
          <span class="algo">SHA-1</span>
          <span class="value empty" id="v-sha1">—</span>
          <button class="copy-btn" data-target="v-sha1">COPIAR</button>
        </div>
        <div class="hash-row">
          <span class="algo">SHA-256</span>
          <span class="value empty" id="v-sha256">—</span>
          <button class="copy-btn" data-target="v-sha256">COPIAR</button>
        </div>
        <div class="hash-row">
          <span class="algo">SHA-512</span>
          <span class="value empty" id="v-sha512">—</span>
          <button class="copy-btn" data-target="v-sha512">COPIAR</button>
        </div>
      </div>
    </div>
    <div class="footer">
      <span>// PROJETO DE ANTÓNIO SALVADOR</span>
      <a href="https://antoniojoserms.github.io/Portfolio/" target="_blank">portfolio →</a>
    </div>
  </div>

<script>
(function(){
  // MD5 — implementação clássica de domínio público (Myers/Holt), verificada
  // contra vetores de teste conhecidos (RFC 1321) antes de ser usada aqui.
  function md5(string) {
    function rotateLeft(x, n) { return (x << n) | (x >>> (32 - n)); }
    function addUnsigned(x, y) {
      var x4 = (x & 0x40000000), y4 = (y & 0x40000000);
      var x8 = (x & 0x80000000), y8 = (y & 0x80000000);
      var result = (x & 0x3FFFFFFF) + (y & 0x3FFFFFFF);
      if (x4 & y4) return (result ^ 0x80000000 ^ x8 ^ y8);
      if (x4 | y4) {
        if (result & 0x40000000) return (result ^ 0xC0000000 ^ x8 ^ y8);
        else return (result ^ 0x40000000 ^ x8 ^ y8);
      } else return (result ^ x8 ^ y8);
    }
    function F(x, y, z) { return (x & y) | (~x & z); }
    function G(x, y, z) { return (x & z) | (y & ~z); }
    function H(x, y, z) { return x ^ y ^ z; }
    function I(x, y, z) { return y ^ (x | (~z)); }
    function FF(a,b,c,d,x,s,ac){ a=addUnsigned(a,addUnsigned(addUnsigned(F(b,c,d),x),ac)); return addUnsigned(rotateLeft(a,s),b); }
    function GG(a,b,c,d,x,s,ac){ a=addUnsigned(a,addUnsigned(addUnsigned(G(b,c,d),x),ac)); return addUnsigned(rotateLeft(a,s),b); }
    function HHf(a,b,c,d,x,s,ac){ a=addUnsigned(a,addUnsigned(addUnsigned(H(b,c,d),x),ac)); return addUnsigned(rotateLeft(a,s),b); }
    function II(a,b,c,d,x,s,ac){ a=addUnsigned(a,addUnsigned(addUnsigned(I(b,c,d),x),ac)); return addUnsigned(rotateLeft(a,s),b); }
    function convertToWordArray(string) {
      var wordCount, messageLength = string.length;
      var n1 = messageLength + 8, n2 = (n1 - (n1 % 64)) / 64;
      var numberOfWords = (n2 + 1) * 16;
      var wordArray = new Array(numberOfWords - 1);
      var bytePosition = 0, byteCount = 0;
      while (byteCount < messageLength) {
        wordCount = (byteCount - (byteCount % 4)) / 4;
        bytePosition = (byteCount % 4) * 8;
        wordArray[wordCount] = (wordArray[wordCount] | (string.charCodeAt(byteCount) << bytePosition));
        byteCount++;
      }
      wordCount = (byteCount - (byteCount % 4)) / 4;
      bytePosition = (byteCount % 4) * 8;
      wordArray[wordCount] = wordArray[wordCount] | (0x80 << bytePosition);
      wordArray[numberOfWords - 2] = messageLength << 3;
      wordArray[numberOfWords - 1] = messageLength >>> 29;
      return wordArray;
    }
    function wordToHex(value) {
      var s = "", tmp, byte, count;
      for (count = 0; count <= 3; count++) {
        byte = (value >>> (count * 8)) & 255;
        tmp = "0" + byte.toString(16);
        s += tmp.substr(tmp.length - 2, 2);
      }
      return s;
    }
    function utf8Encode(string) { return unescape(encodeURIComponent(string)); }
    var x, k, AA, BB, CC, DD, a, b, c, d;
    var S11=7,S12=12,S13=17,S14=22,S21=5,S22=9,S23=14,S24=20;
    var S31=4,S32=11,S33=16,S34=23,S41=6,S42=10,S43=15,S44=21;
    string = utf8Encode(string);
    x = convertToWordArray(string);
    a = 0x67452301; b = 0xEFCDAB89; c = 0x98BADCFE; d = 0x10325476;
    for (k = 0; k < x.length; k += 16) {
      AA=a; BB=b; CC=c; DD=d;
      a=FF(a,b,c,d,x[k+0],S11,0xD76AA478); d=FF(d,a,b,c,x[k+1],S12,0xE8C7B756);
      c=FF(c,d,a,b,x[k+2],S13,0x242070DB); b=FF(b,c,d,a,x[k+3],S14,0xC1BDCEEE);
      a=FF(a,b,c,d,x[k+4],S11,0xF57C0FAF); d=FF(d,a,b,c,x[k+5],S12,0x4787C62A);
      c=FF(c,d,a,b,x[k+6],S13,0xA8304613); b=FF(b,c,d,a,x[k+7],S14,0xFD469501);
      a=FF(a,b,c,d,x[k+8],S11,0x698098D8); d=FF(d,a,b,c,x[k+9],S12,0x8B44F7AF);
      c=FF(c,d,a,b,x[k+10],S13,0xFFFF5BB1); b=FF(b,c,d,a,x[k+11],S14,0x895CD7BE);
      a=FF(a,b,c,d,x[k+12],S11,0x6B901122); d=FF(d,a,b,c,x[k+13],S12,0xFD987193);
      c=FF(c,d,a,b,x[k+14],S13,0xA679438E); b=FF(b,c,d,a,x[k+15],S14,0x49B40821);
      a=GG(a,b,c,d,x[k+1],S21,0xF61E2562); d=GG(d,a,b,c,x[k+6],S22,0xC040B340);
      c=GG(c,d,a,b,x[k+11],S23,0x265E5A51); b=GG(b,c,d,a,x[k+0],S24,0xE9B6C7AA);
      a=GG(a,b,c,d,x[k+5],S21,0xD62F105D); d=GG(d,a,b,c,x[k+10],S22,0x2441453);
      c=GG(c,d,a,b,x[k+15],S23,0xD8A1E681); b=GG(b,c,d,a,x[k+4],S24,0xE7D3FBC8);
      a=GG(a,b,c,d,x[k+9],S21,0x21E1CDE6); d=GG(d,a,b,c,x[k+14],S22,0xC33707D6);
      c=GG(c,d,a,b,x[k+3],S23,0xF4D50D87); b=GG(b,c,d,a,x[k+8],S24,0x455A14ED);
      a=GG(a,b,c,d,x[k+13],S21,0xA9E3E905); d=GG(d,a,b,c,x[k+2],S22,0xFCEFA3F8);
      c=GG(c,d,a,b,x[k+7],S23,0x676F02D9); b=GG(b,c,d,a,x[k+12],S24,0x8D2A4C8A);
      a=HHf(a,b,c,d,x[k+5],S31,0xFFFA3942); d=HHf(d,a,b,c,x[k+8],S32,0x8771F681);
      c=HHf(c,d,a,b,x[k+11],S33,0x6D9D6122); b=HHf(b,c,d,a,x[k+14],S34,0xFDE5380C);
      a=HHf(a,b,c,d,x[k+1],S31,0xA4BEEA44); d=HHf(d,a,b,c,x[k+4],S32,0x4BDECFA9);
      c=HHf(c,d,a,b,x[k+7],S33,0xF6BB4B60); b=HHf(b,c,d,a,x[k+10],S34,0xBEBFBC70);
      a=HHf(a,b,c,d,x[k+13],S31,0x289B7EC6); d=HHf(d,a,b,c,x[k+0],S32,0xEAA127FA);
      c=HHf(c,d,a,b,x[k+3],S33,0xD4EF3085); b=HHf(b,c,d,a,x[k+6],S34,0x4881D05);
      a=HHf(a,b,c,d,x[k+9],S31,0xD9D4D039); d=HHf(d,a,b,c,x[k+12],S32,0xE6DB99E5);
      c=HHf(c,d,a,b,x[k+15],S33,0x1FA27CF8); b=HHf(b,c,d,a,x[k+2],S34,0xC4AC5665);
      a=II(a,b,c,d,x[k+0],S41,0xF4292244); d=II(d,a,b,c,x[k+7],S42,0x432AFF97);
      c=II(c,d,a,b,x[k+14],S43,0xAB9423A7); b=II(b,c,d,a,x[k+5],S44,0xFC93A039);
      a=II(a,b,c,d,x[k+12],S41,0x655B59C3); d=II(d,a,b,c,x[k+3],S42,0x8F0CCC92);
      c=II(c,d,a,b,x[k+10],S43,0xFFEFF47D); b=II(b,c,d,a,x[k+1],S44,0x85845DD1);
      a=II(a,b,c,d,x[k+8],S41,0x6FA87E4F); d=II(d,a,b,c,x[k+15],S42,0xFE2CE6E0);
      c=II(c,d,a,b,x[k+6],S43,0xA3014314); b=II(b,c,d,a,x[k+13],S44,0x4E0811A1);
      a=II(a,b,c,d,x[k+4],S41,0xF7537E82); d=II(d,a,b,c,x[k+11],S42,0xBD3AF235);
      c=II(c,d,a,b,x[k+2],S43,0x2AD7D2BB); b=II(b,c,d,a,x[k+9],S44,0xEB86D391);
      a=addUnsigned(a,AA); b=addUnsigned(b,BB); c=addUnsigned(c,CC); d=addUnsigned(d,DD);
    }
    return (wordToHex(a)+wordToHex(b)+wordToHex(c)+wordToHex(d)).toLowerCase();
  }

  async function sha(algo, text) {
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest(algo, enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  const input = document.getElementById('input');
  const outputs = {
    'v-md5': null,
    'v-sha1': null,
    'v-sha256': null,
    'v-sha512': null
  };

  let debounceTimer;
  input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(update, 120);
  });

  async function update() {
    const text = input.value;
    const els = {
      md5: document.getElementById('v-md5'),
      sha1: document.getElementById('v-sha1'),
      sha256: document.getElementById('v-sha256'),
      sha512: document.getElementById('v-sha512')
    };
    if (!text) {
      Object.values(els).forEach(el => { el.textContent = '—'; el.classList.add('empty'); });
      return;
    }
    els.md5.textContent = md5(text);
    els.md5.classList.remove('empty');
    els.sha1.textContent = await sha('SHA-1', text);
    els.sha1.classList.remove('empty');
    els.sha256.textContent = await sha('SHA-256', text);
    els.sha256.classList.remove('empty');
    els.sha512.textContent = await sha('SHA-512', text);
    els.sha512.classList.remove('empty');
  }

  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = document.getElementById(btn.dataset.target);
      const text = target.textContent;
      if (!text || text === '—') return;
      navigator.clipboard.writeText(text).then(() => {
        const original = btn.textContent;
        btn.textContent = 'OK';
        setTimeout(() => btn.textContent = original, 1000);
      });
    });
  });
})();
</script>
</body>
</html>
